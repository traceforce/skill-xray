name: release

# A pushed tag v<version> builds the binary for every platform the pinned OpenGrep runtime
# covers, checks that the tag names the version compiled into the binary, and publishes the
# archives with their SHA-256 sums as a GitHub release. The binary installs the pinned engine
# on first use, so the archives hold the scanner alone.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: The tag names the compiled version
        run: |
          set -euo pipefail
          go build -o bin/ ./cmd/skill-xray
          version="$(./bin/skill-xray version | awk '{print $2}')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not name the compiled version $version"
            exit 1
          fi
      - name: Build every platform
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="skill-xray_${version}_${os}_${arch}"
            binary=skill-xray
            if [ "$os" = windows ]; then
              binary=skill-xray.exe
            fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags='-s -w' -o "dist/$name/$binary" ./cmd/skill-xray
            cp LICENSE README.md THIRD_PARTY_NOTICES "dist/$name/"
            if [ "$os" = windows ]; then
              (cd dist && zip -qr "$name.zip" "$name")
            else
              tar -C dist -czf "dist/$name.tar.gz" "$name"
            fi
            rm -r "dist/$name"
          done
          (cd dist && sha256sum -- * > SHA256SUMS)
          ls -l dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
