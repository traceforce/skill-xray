name: release

# A pushed tag v<version> runs the CI matrix on the tagged commit (the tag must name the version
# compiled into the binary, the pinned engine is installed, then build, vet and tests on Linux,
# macOS and Windows), and only then builds the binary for every platform the pinned OpenGrep
# runtime covers and publishes the archives with their SHA-256 sums as a GitHub release. The
# engine is fetched separately by `skill-xray install-opengrep`, so the archives hold the scanner
# alone.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build -o bin/ ./cmd/skill-xray
      - name: The tag names the compiled version
        shell: bash
        run: |
          set -euo pipefail
          version="$(./bin/skill-xray version | awk '{print $2}')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not name the compiled version $version"
            exit 1
          fi
      - name: Install pinned OpenGrep
        run: ./bin/skill-xray install-opengrep
        shell: bash
      - name: Build, vet and test
        if: runner.os != 'Windows'
        run: make ci
      - name: Build, vet and test
        if: runner.os == 'Windows'
        run: |
          go build ./...
          go vet ./...
          go test -timeout 30m ./...

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Build every platform
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="skill-xray_${version}_${os}_${arch}"
            binary=skill-xray
            if [ "$os" = windows ]; then
              binary=skill-xray.exe
            fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags='-s -w' -o "dist/$name/$binary" ./cmd/skill-xray
            cp LICENSE NOTICE README.md "dist/$name/"
            if [ "$os" = windows ]; then
              (cd dist && zip -qr "$name.zip" "$name")
            else
              tar -C dist -czf "dist/$name.tar.gz" "$name"
            fi
            rm -r "dist/$name"
          done
          (cd dist && sha256sum -- * > SHA256SUMS)
          ls -l dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
