name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer commit on a PR cancels the older in-progress run; main is left alone so every merged
# commit still gets a completed status.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  go:
    # All three platforms are required: the walker has Windows-only and Unix-only code paths,
    # the symlink tests run on Linux and macOS, the NTFS junction test runs on Windows, macOS is
    # where file names arrive in a different Unicode form, and the live OpenGrep tests need the
    # pinned binary. ubuntu and macos run `make ci`, the target mcp-xray's CI runs; Windows runs
    # its three commands directly because the runner image has no GNU make.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build -o bin/ ./cmd/skill-xray
      - name: Smoke
        run: ./bin/skill-xray version
        shell: bash
      - name: Install pinned OpenGrep
        run: ./bin/skill-xray install-opengrep
        shell: bash
      - name: Format
        run: test -z "$(gofmt -l ./cmd ./internal ./tools)"
        shell: bash
      - name: Lint
        if: runner.os == 'Linux'
        run: make lint
      - name: Dependencies against the Go vulnerability database
        if: runner.os == 'Linux'
        run: make vuln
      - name: Security analysis of the Go code
        if: runner.os == 'Linux'
        run: make sec
      - name: Security analysis of the Windows build
        if: runner.os == 'Windows'
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 -quiet -severity medium -confidence medium -exclude-dir internal/testutil -exclude-dir tools ./...
      - name: Cross-compile for every platform the pinned OpenGrep runtime covers
        if: runner.os == 'Linux'
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/skill-xray
          done
      - name: Build, vet and test
        if: runner.os != 'Windows'
        run: make ci
      - name: Build, vet and test
        if: runner.os == 'Windows'
        run: |
          go build ./...
          go vet ./...
          go test -timeout 30m ./...
