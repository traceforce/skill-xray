name: parity

# The Go scanner must produce the same findings, JSON and SARIF bytes as the Python scanner in
# this repository. The fixtures are materialised from the Python test suite, every module's
# corpus gate compares the two as decoded JSON, and the harness compares the two CLIs byte for
# byte. The run takes over an hour on a hosted runner, so it is not tied to every push: it runs
# on main, weekly, on demand, and on a pull request only while the request carries the `parity`
# label (adding the label starts it, every later push to the labelled request reruns it,
# any other label leaves it alone).
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'tools/parity/**'
      - 'src/**'
      - 'tests/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/parity.yml'
  pull_request:
    types: [labeled, opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  go-against-python:
    # on a pull request: the `parity` label being added, or any other event while the request
    # carries it; adding an unrelated label does not start or restart the run
    if: >-
      github.event_name != 'pull_request'
      || (github.event.action == 'labeled' && github.event.label.name == 'parity')
      || (github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'parity'))
    # job-level, so a run whose job is skipped never cancels an active one
    concurrency:
      group: parity-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.4"
      - name: Install the Python scanner and its test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Build
        run: go build -o bin/ ./cmd/skill-xray
      - name: Install pinned OpenGrep
        run: ./bin/skill-xray install-opengrep
      - name: Materialise the fixtures from the Python test suite
        run: make corpus
      - name: Module gates (each check's findings, Go against Python, as decoded JSON)
        run: go test -count=1 -timeout 100m -run 'TestCorpusParity|TestPyDumpFindingsMatchesFindingJSON|TestRunOneOracleOnlyCachesAndReportsGoAbsent|TestPyDumpIRProducesOneDocumentPerArtifact' ./internal/... ./tools/parity/
      - name: Harness (CLI JSON and SARIF, byte for byte)
        run: go run ./tools/parity run --corpus corpus/pytest -j 4 --oracle .
      - name: Report
        if: always()
        run: test -f corpus/parity-report.md && cat corpus/parity-report.md || echo "no parity report written"
