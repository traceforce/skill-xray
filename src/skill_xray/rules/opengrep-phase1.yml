rules:
  - id: skill-xray.python-local-command-injection
    languages: [python]
    mode: taint
    message: Untrusted local input reaches a Python command-execution sink.
    severity: ERROR
    metadata:
      skill_xray_vector: SXV-008
      skill_xray_rule: opengrep-python-command-injection
      skill_xray_severity: critical
    options:
      max_match_per_file: 1000
      taint_intrafile: true
      taint_assume_safe_indexes: true
    pattern-sources:
      - pattern-either:
          - pattern: input(...)
          - pattern: raw_input(...)
          - pattern: sys.argv[$INDEX]
          - pattern: os.environ[$KEY]
          - pattern: os.environ.get(...)
          - pattern: os.getenv(...)
          - pattern: sys.stdin.read(...)
          - pattern: sys.stdin.readline(...)
          - pattern: sys.stdin.readlines(...)
          - pattern: sys.stdin.buffer.read(...)
          - pattern: sys.stdin.buffer.readline(...)
          - pattern: sys.stdin.buffer.readlines(...)
      - exact: true
        pattern: sys.stdin
      - exact: true
        pattern: sys.argv
      - exact: true
        pattern-either:
          - pattern: sys.argv[$START:]
          - pattern: sys.argv[$START:$END]
      - exact: true
        pattern: subprocess.list2cmdline(sys.argv)
      - exact: true
        pattern: yaml.safe_load(sys.stdin.read(...))
      - exact: true
        pattern: '" ".join($ITEM for $ITEM in sys.argv)'
      - patterns:
          - pattern: $ITEM
          - pattern-inside: |
              for $ITEM in sys.argv[$SLICE]:
                ...
      - patterns:
          - pattern: shlex.quote($VALUE)
          - pattern-inside: |
              $VALUE = sys.argv[$INDEX]
              ...
      - patterns:
          - pattern: $PARSER.parse_args(...)
          - pattern-inside: |
              $PARSER = argparse.ArgumentParser(...)
              ...
      - patterns:
          - pattern: $PARSER.parse_known_args(...)
          - pattern-inside: |
              $PARSER = argparse.ArgumentParser(...)
              ...
    pattern-propagators:
      - pattern: $OUT = shlex.quote($IN)
        from: $IN
        to: $OUT
    pattern-sinks:
      - patterns:
          - pattern: shlex.quote($COMMAND)
          - pattern-inside: os.system(...)
          - focus-metavariable: $COMMAND
      - patterns:
          - pattern-either:
              - pattern: os.system($COMMAND)
              - pattern: os.popen($COMMAND, ...)
              - pattern: eval($COMMAND, ...)
              - pattern: exec($COMMAND, ...)
              - pattern: builtins.eval($COMMAND, ...)
              - pattern: builtins.exec($COMMAND, ...)
          - focus-metavariable: $COMMAND
      - patterns:
          - pattern: subprocess.$METHOD($COMMAND, ..., shell=$SHELL, ...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(run|call|check_call|check_output|Popen)$
          - focus-metavariable: $COMMAND
      - patterns:
          - pattern: $METHOD($COMMAND, ..., shell=$SHELL, ...)
          - pattern-inside: |
              from subprocess import *
              ...
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(run|call|check_call|check_output|Popen)$
          - focus-metavariable: $COMMAND
      - patterns:
          - pattern: subprocess.$METHOD(..., args=$COMMAND, ..., shell=$SHELL, ...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(run|call|check_call|check_output|Popen)$
          - focus-metavariable: $COMMAND
      - patterns:
          - pattern: subprocess.$METHOD($COMMAND, ..., **$KWARGS)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(run|call|check_call|check_output|Popen)$
          - focus-metavariable: $COMMAND
      - patterns:
          - pattern: subprocess.$METHOD(..., args=$COMMAND, ..., **$KWARGS)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(run|call|check_call|check_output|Popen)$
          - focus-metavariable: $COMMAND
      - patterns:
          - pattern: subprocess.$METHOD($COMMAND, ...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(getoutput|getstatusoutput)$
          - focus-metavariable: $COMMAND
      - patterns:
          - pattern: subprocess.$METHOD([$SHELL, "-c", $COMMAND, ...], ...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(run|call|check_call|check_output|Popen)$
          - metavariable-regex:
              metavariable: $SHELL
              regex: '(?i)^["'']?(?:(?:/usr)?/bin/)?(?:sh|bash|zsh|ksh|dash)["'']?$'
          - focus-metavariable: $COMMAND
      - patterns:
          - pattern-either:
              - pattern: os.execl($SHELL, $ARGV0, "-c", $COMMAND, ...)
              - pattern: os.execlp($SHELL, $ARGV0, "-c", $COMMAND, ...)
              - pattern: os.execle($SHELL, $ARGV0, "-c", $COMMAND, ..., $ENV)
              - pattern: os.execv($SHELL, [$ARGV0, "-c", $COMMAND, ...])
              - pattern: os.execvp($SHELL, [$ARGV0, "-c", $COMMAND, ...])
              - pattern: os.execve($SHELL, [$ARGV0, "-c", $COMMAND, ...], $ENV)
              - pattern: os.execvpe($SHELL, [$ARGV0, "-c", $COMMAND, ...], $ENV)
              - pattern: os.posix_spawn($SHELL, [$ARGV0, "-c", $COMMAND, ...], $ENV, ...)
              - pattern: os.posix_spawnp($SHELL, [$ARGV0, "-c", $COMMAND, ...], $ENV, ...)
          - metavariable-regex:
              metavariable: $SHELL
              regex: '(?i)^["'']?(?:(?:/usr)?/bin/)?(?:sh|bash|zsh|ksh|dash)["'']?$'
          - focus-metavariable: $COMMAND
      - patterns:
          - pattern: $ALIAS($COMMAND)
          - pattern-inside: |
              $ALIAS = os.system
              ...
          - focus-metavariable: $COMMAND

  - id: skill-xray.python-local-helper-command-injection
    languages: [python]
    message: Untrusted local input reaches a Python command-execution sink.
    severity: ERROR
    metadata:
      skill_xray_vector: SXV-008
      skill_xray_rule: opengrep-python-command-injection
      skill_xray_severity: critical
    patterns:
      - pattern-either:
          - pattern: |
              def $FUNC(...):
                ...
                os.system($COMMAND)
                ...
              ...
              if $CONDITION:
                ...
                $FUNC = $OTHER
                ...
              ...
              $FUNC(..., $SOURCE, ...)
          - pattern: |
              def $FUNC(...):
                ...
                os.system($COMMAND)
                ...
              ...
              try:
                ...
              except $EXCEPTION:
                ...
                $FUNC = $OTHER
                ...
              ...
              $FUNC(..., $SOURCE, ...)
          - pattern: |
              def $FUNC(...):
                ...
                os.system($COMMAND)
                ...
              ...
              $FUNC(..., $SOURCE, ...)
              ...
              def $FUNC(...):
                ...
          - pattern: |
              def $FUNC(...):
                ...
                os.system($COMMAND)
                ...
              ...
              $FUNC(..., **{$KEY: $SOURCE}, ...)
          - pattern: |
              class $CLASS:
                ...
                def $METHOD(...):
                  ...
                  os.system($COMMAND)
                  ...
              ...
              $CLASS().$METHOD(..., $SOURCE, ...)
          - pattern: |
              def $FUNC(..., **$KWARGS):
                ...
                os.system($COMMAND)
                ...
              ...
              $FUNC(..., cmd=$SOURCE, ...)
          - pattern: |
              def $FUNC(*, $PARAM, ...):
                ...
                os.system($COMMAND)
                ...
              ...
              $FUNC(..., $PARAM=$SOURCE, ...)
          - pattern: |
              class $CLASS:
                ...
                def $METHOD($RECEIVER, *, $PARAM, ...):
                  ...
                  os.system($COMMAND)
                  ...
              ...
              $CLASS().$METHOD(..., $PARAM=$SOURCE, ...)
      - metavariable-pattern:
          metavariable: $SOURCE
          patterns:
            - pattern-either:
                - pattern: input(...)
                - pattern: raw_input(...)
                - pattern: sys.argv[$INDEX]
                - pattern: os.environ[$KEY]
                - pattern: os.environ.get(...)
                - pattern: os.getenv(...)
                - pattern: sys.stdin.read(...)
                - pattern: sys.stdin.readline(...)
      - focus-metavariable: $COMMAND

  - id: skill-xray.python-remote-payload-execution
    languages: [python]
    mode: taint
    message: Network-controlled content reaches a Python execution sink.
    severity: ERROR
    metadata:
      skill_xray_vector: SXV-018
      skill_xray_rule: opengrep-python-remote-execution
      skill_xray_severity: critical
    options:
      max_match_per_file: 1000
      taint_intrafile: true
      taint_assume_safe_indexes: true
    pattern-sources:
      - exact: true
        patterns:
          - pattern: requests.$METHOD(...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(get|post|put|head|request)$
      - exact: true
        patterns:
          - pattern: httpx.$METHOD(...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(get|post|put|head|request)$
      - exact: true
        pattern: urllib.request.urlopen(...)
      - exact: true
        patterns:
          - pattern-either:
              - pattern: urlopen(...)
              - pattern: urlopen(...).read(...)
          - pattern-inside: |
              from urllib.request import urlopen
              ...
      - exact: true
        patterns:
          - pattern-either:
              - pattern: $OPEN(...)
              - pattern: $OPEN(...).read(...)
          - pattern-inside: |
              from urllib.request import urlopen as $OPEN
              ...
      - exact: true
        pattern: urllib3.PoolManager(...).request(...)
      - exact: true
        patterns:
          - pattern: requests.$METHOD(...).json(...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(get|post|put|head|request)$
      - exact: true
        patterns:
          - pattern: httpx.$METHOD(...).json(...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(get|post|put|head|request)$
      - exact: true
        pattern: json.load(urllib.request.urlopen(...))
      - exact: true
        pattern: base64.b64decode(requests.$METHOD(...).text)
      - exact: true
        patterns:
          - pattern: $RESPONSE.read(...).decode(...)
          - pattern-inside: |
              $RESPONSE = urllib.request.urlopen(...)
              ...
      - exact: true
        patterns:
          - pattern-either:
              - pattern: $RESPONSE.content.decode(...)
              - pattern: $RESPONSE.json(...)
              - pattern: next($RESPONSE.iter_content(...)).decode(...)
              - pattern: $RESPONSE.raw.read(...).decode(...)
          - pattern-inside: |
              $RESPONSE = $CLIENT.$METHOD(...)
              ...
          - metavariable-regex:
              metavariable: $CLIENT
              regex: ^(?:requests|httpx)$
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(?:get|post|put|head|request)$
    pattern-sanitizers:
      - pattern-either:
          - pattern: $RESPONSE.status_code
          - pattern: $RESPONSE.ok
          - pattern: $RESPONSE.elapsed
          - pattern: $RESPONSE.is_redirect
          - pattern: $RESPONSE.is_permanent_redirect
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: os.system($COMMAND)
              - pattern: os.popen($COMMAND, ...)
              - pattern: eval($COMMAND, ...)
              - pattern: exec($COMMAND, ...)
              - pattern: builtins.eval($COMMAND, ...)
              - pattern: builtins.exec($COMMAND, ...)
          - focus-metavariable: $COMMAND
      - patterns:
          - pattern: subprocess.$METHOD($COMMAND, ..., shell=$SHELL, ...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(run|call|check_call|check_output|Popen)$
          - focus-metavariable: $COMMAND
      - patterns:
          - pattern: $METHOD($COMMAND, ..., shell=$SHELL, ...)
          - pattern-inside: |
              from subprocess import *
              ...
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(run|call|check_call|check_output|Popen)$
          - focus-metavariable: $COMMAND
      - patterns:
          - pattern: subprocess.$METHOD(..., args=$COMMAND, ..., shell=$SHELL, ...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(run|call|check_call|check_output|Popen)$
          - focus-metavariable: $COMMAND
      - patterns:
          - pattern: subprocess.$METHOD($COMMAND, ..., **$KWARGS)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(run|call|check_call|check_output|Popen)$
          - focus-metavariable: $COMMAND
      - patterns:
          - pattern: subprocess.$METHOD(..., args=$COMMAND, ..., **$KWARGS)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(run|call|check_call|check_output|Popen)$
          - focus-metavariable: $COMMAND
      - patterns:
          - pattern: subprocess.$METHOD($COMMAND, ...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(getoutput|getstatusoutput)$
          - focus-metavariable: $COMMAND
      - patterns:
          - pattern: subprocess.$METHOD([$SHELL, "-c", $COMMAND, ...], ...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(run|call|check_call|check_output|Popen)$
          - metavariable-regex:
              metavariable: $SHELL
              regex: '(?i)^["'']?(?:(?:/usr)?/bin/)?(?:sh|bash|zsh|ksh|dash)["'']?$'
          - focus-metavariable: $COMMAND
      - patterns:
          - pattern-either:
              - pattern: os.execl($SHELL, $ARGV0, "-c", $COMMAND, ...)
              - pattern: os.execlp($SHELL, $ARGV0, "-c", $COMMAND, ...)
              - pattern: os.execle($SHELL, $ARGV0, "-c", $COMMAND, ..., $ENV)
              - pattern: os.execv($SHELL, [$ARGV0, "-c", $COMMAND, ...])
              - pattern: os.execvp($SHELL, [$ARGV0, "-c", $COMMAND, ...])
              - pattern: os.execve($SHELL, [$ARGV0, "-c", $COMMAND, ...], $ENV)
              - pattern: os.execvpe($SHELL, [$ARGV0, "-c", $COMMAND, ...], $ENV)
              - pattern: os.posix_spawn($SHELL, [$ARGV0, "-c", $COMMAND, ...], $ENV, ...)
              - pattern: os.posix_spawnp($SHELL, [$ARGV0, "-c", $COMMAND, ...], $ENV, ...)
          - metavariable-regex:
              metavariable: $SHELL
              regex: '(?i)^["'']?(?:(?:/usr)?/bin/)?(?:sh|bash|zsh|ksh|dash)["'']?$'
          - focus-metavariable: $COMMAND
      - patterns:
          - pattern: $ALIAS($COMMAND)
          - pattern-inside: |
              $ALIAS = os.system
              ...
          - focus-metavariable: $COMMAND

  - id: skill-xray.shell-fetch-pipe-exec
    languages: [bash]
    message: Remote fetch is piped directly into a shell interpreter.
    severity: ERROR
    metadata:
      skill_xray_vector: SXV-009
      skill_xray_rule: opengrep-shell-fetch-pipe-exec
      skill_xray_severity: high
    patterns:
      - pattern-either:
          - pattern: $FETCH ... $URL ... | $SH
          - pattern: $FETCH ... $URL ... | $SH -s
          - pattern: $FETCH ... $URL ... | $SH -s ...
          - pattern: $FETCH ... $URL ... | $SH -e
          - pattern: $FETCH ... $URL ... | $SH /dev/stdin
          - pattern: $FETCH ... $URL ... | sudo $SH
          - pattern: $FETCH ... $URL ... | sudo -i $SH
          - pattern: $FETCH ... $URL ... | sudo -u $USER $SH
          - pattern: sudo $FETCH ... $URL ... | $SH
          - pattern: $FETCH ... $URL ... | busybox $SH
          - pattern: $FETCH ... $URL ... | chroot $ROOT $SH
          - pattern: $FETCH ... $URL ... | stdbuf $OPTION $VALUE $SH
          - pattern: $FETCH ... $URL ... | tee ... | $SH
          - pattern: $SH <($FETCH ... $URL ...)
      - pattern-not: $FETCH ... -o $URL ... | ...
      - pattern-not: $FETCH ... --output $URL ... | ...
      - pattern-not: $FETCH ... -O $URL ... | ...
      - pattern-not: $FETCH ... --output-document $URL ... | ...
      - pattern-not-regex: '(?i)(?:^|[ \t])(?:-o|--output(?:-document)?|-O)(?:=)?[ \t]*(?!-(?:[ \t]|$)|/dev/stdout(?:[ \t]|$))\S+'
      - metavariable-regex:
          metavariable: $FETCH
          regex: '^(?:curl|wget|aria2c|http|httpie)$'
      - metavariable-regex:
          metavariable: $URL
          regex: '(?i)^(?:(?:https?|ftp)://|\$\{?[A-Za-z_][A-Za-z0-9_]*\}?)'
      - metavariable-regex:
          metavariable: $SH
          regex: '^(?:(?:/usr)?/bin/)?(?:sh|bash|zsh|ksh|dash|fish)$'

  - id: skill-xray.shell-fetch-pipe-env-exec
    languages: [bash]
    message: Remote fetch is piped through env into a shell interpreter.
    severity: ERROR
    metadata:
      skill_xray_vector: SXV-009
      skill_xray_rule: opengrep-shell-fetch-pipe-exec
      skill_xray_severity: high
    patterns:
      - pattern-either:
          - pattern: $FETCH ... $URL ... | $ENV $ASSIGN ... $SH
          - pattern: $FETCH ... $URL ... | $ENV $ASSIGN ... $SH -s ...
      - pattern-not: $FETCH ... -o $URL ... | ...
      - pattern-not: $FETCH ... --output $URL ... | ...
      - pattern-not: $FETCH ... -O $URL ... | ...
      - pattern-not: $FETCH ... --output-document $URL ... | ...
      - pattern-not-regex: '(?i)(?:^|[ \t])(?:-o|--output(?:-document)?|-O)(?:=)?[ \t]*(?!-(?:[ \t]|$)|/dev/stdout(?:[ \t]|$))\S+'
      - metavariable-regex:
          metavariable: $FETCH
          regex: '^(?:curl|wget|aria2c|http|httpie)$'
      - metavariable-regex:
          metavariable: $URL
          regex: '(?i)^(?:(?:https?|ftp)://|\$\{?[A-Za-z_][A-Za-z0-9_]*\}?)'
      - metavariable-regex:
          metavariable: $ASSIGN
          regex: '^[A-Za-z_][A-Za-z0-9_]*=.*$'
      - metavariable-regex:
          metavariable: $ENV
          regex: '^(?:/usr/bin/)?env$'
      - metavariable-regex:
          metavariable: $SH
          regex: '^(?:(?:/usr)?/bin/)?(?:sh|bash|zsh|ksh|dash|fish)$'

  - id: skill-xray.shell-fetch-pipe-env-no-assignment-exec
    languages: [bash]
    message: Remote fetch is piped through env into a shell interpreter.
    severity: ERROR
    metadata:
      skill_xray_vector: SXV-009
      skill_xray_rule: opengrep-shell-fetch-pipe-exec
      skill_xray_severity: high
    patterns:
      - pattern-either:
          - pattern: $FETCH ... $URL ... | $ENV $SH
          - pattern: $FETCH ... $URL ... | $ENV $SH -s ...
      - pattern-not-regex: '(?i)(?:^|[ \t])(?:-o|--output(?:-document)?|-O)(?:=)?[ \t]*(?!-(?:[ \t]|$)|/dev/stdout(?:[ \t]|$))\S+'
      - metavariable-regex:
          metavariable: $FETCH
          regex: '^(?:curl|wget|aria2c|http|httpie)$'
      - metavariable-regex:
          metavariable: $URL
          regex: '(?i)^(?:(?:https?|ftp)://|\$\{?[A-Za-z_][A-Za-z0-9_]*\}?)'
      - metavariable-regex:
          metavariable: $ENV
          regex: '^(?:/usr/bin/)?env$'
      - metavariable-regex:
          metavariable: $SH
          regex: '^(?:(?:/usr)?/bin/)?(?:sh|bash|zsh|ksh|dash|fish)$'

  - id: skill-xray.shell-fetch-pipe-timeout-exec
    languages: [bash]
    message: Remote fetch is piped through timeout into a shell interpreter.
    severity: ERROR
    metadata:
      skill_xray_vector: SXV-009
      skill_xray_rule: opengrep-shell-fetch-pipe-exec
      skill_xray_severity: high
    patterns:
      - pattern-either:
          - pattern: $FETCH ... $URL ... | timeout $DURATION $SH
          - pattern: $FETCH ... $URL ... | timeout -k $KILL $DURATION $SH
      - pattern-not: $FETCH ... -o $URL ... | ...
      - pattern-not: $FETCH ... --output $URL ... | ...
      - pattern-not: $FETCH ... -O $URL ... | ...
      - pattern-not: $FETCH ... --output-document $URL ... | ...
      - pattern-not-regex: '(?i)(?:^|[ \t])(?:-o|--output(?:-document)?|-O)(?:=)?[ \t]*(?!-(?:[ \t]|$)|/dev/stdout(?:[ \t]|$))\S+'
      - metavariable-regex:
          metavariable: $FETCH
          regex: '^(?:curl|wget|aria2c|http|httpie)$'
      - metavariable-regex:
          metavariable: $URL
          regex: '(?i)^(?:(?:https?|ftp)://|\$\{?[A-Za-z_][A-Za-z0-9_]*\}?)'
      - metavariable-regex:
          metavariable: $DURATION
          regex: '^[0-9]+(?:\.[0-9]+)?[smhd]?$'
      - metavariable-regex:
          metavariable: $SH
          regex: '^(?:sh|bash|zsh|ksh|dash|fish)$'

  - id: skill-xray.shell-fetch-special-stdin-exec
    languages: [bash]
    message: Remote input is executed through a shell stdin construct.
    severity: ERROR
    metadata:
      skill_xray_vector: SXV-009
      skill_xray_rule: opengrep-shell-fetch-pipe-exec
      skill_xray_severity: high
    patterns:
      - pattern: $FETCH ... $URL ...
      - pattern-regex: '(?m)^[ \t]*(?:(?:curl|wget|aria2c|http|httpie)[^\n|]*(?:https?|ftp)://[^\n|]+\|[ \t]*(?:(?:/usr/bin/)?env(?:[ \t]+[A-Za-z_][A-Za-z0-9_]*=[^ \t]+)*[ \t]+)?(?:(?:/usr)?/bin/)?(?:sh|bash|zsh|ksh|dash|fish)(?:(?:[ \t]+-[abefhkmptuvxsBCHP]+)+|[ \t]+-[abefhkmptuvxsBCHP]*o[ \t]+(?:allexport|errexit|errtrace|functrace|hashall|ignoreeof|keyword|monitor|noclobber|noexec|noglob|nolog|notify|nounset|onecmd|physical|pipefail|posix|privileged|verbose|vi|xtrace))[ \t]*|(?:source|\.)[ \t]+<\((?:curl|wget|aria2c|http|httpie)[^\n)]*(?:https?|ftp)://[^\n)]+\))[ \t]*(?:[#;]|$)'
      - metavariable-regex:
          metavariable: $FETCH
          regex: '^(?:curl|wget|aria2c|http|httpie)$'
      - metavariable-regex:
          metavariable: $URL
          regex: '(?i)^(?:https?|ftp)://'

  - id: skill-xray.shell-fetch-alias-pipe-exec
    languages: [bash]
    message: A literal remote-fetch alias is piped into a shell interpreter.
    severity: ERROR
    metadata:
      skill_xray_vector: SXV-009
      skill_xray_rule: opengrep-shell-fetch-pipe-exec
      skill_xray_severity: high
    patterns:
      - pattern: $COMMAND ... | $SH ...
      - pattern-regex: '(?m)^[ \t]*(?P<ALIAS>[A-Za-z_][A-Za-z0-9_]*)=(?:curl|wget)[ \t]*\n(?:(?![ \t]*(?P=ALIAS)=)[^\n]*\n){0,8}[ \t]*\$(?P=ALIAS)[^\n|]*(?:https?|ftp)://\S+[^\n|]*\|[ \t]*(?:sh|bash|zsh|ksh|dash|fish)(?:[ \t;]|$)'

  - id: skill-xray.shell-command-substitution-taint
    languages: [bash]
    mode: taint
    message: A remote fetch result reaches eval or a shell command string.
    severity: ERROR
    metadata:
      skill_xray_vector: SXV-009
      skill_xray_rule: opengrep-shell-command-substitution-taint
      skill_xray_severity: high
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: curl ... $URL ...
              - pattern: wget ... $URL ...
          - pattern-not: curl ... -o $URL ...
          - pattern-not: curl ... --output $URL ...
          - pattern-not: wget ... -O $URL ...
          - pattern-not: wget ... --output-document $URL ...
          - metavariable-regex:
              metavariable: $URL
