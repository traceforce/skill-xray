[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-xray"
version = "0.1.0"
description = "Static security scanner for AI skill packages."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
# 3.12.4 floor: the junction-escape guard needs os.path.isjunction (3.12+), and
# 3.12.4 fixes CVE-2024-4032 so ipaddress.is_global rejects IPv4-mapped metadata.
requires-python = ">=3.12.4"
# Content parsing (parse.py) uses a real parser per format.
dependencies = [
    "ruamel.yaml>=0.18",    # frontmatter: safe mode + duplicate-key detection
    "markdown-it-py>=3",    # CommonMark markdown structure + preprocessing tokens
    "tree-sitter>=0.23",    # error-recovering shell CST
    "tree-sitter-bash>=0.23",
    "packaging>=23",        # dependency specifier parsing
    "python-bidi>=0.6",     # UAX-9 bidi algorithm for Trojan-Source reordering (SXV-014)
    "confusable-homoglyphs>=3.3",  # UTS #39 confusables data for SXV-015 homoglyph folding
    "jsonschema==4.26.0",  # offline validation against the official SARIF schema
]

[project.scripts]
skill-xray = "skill_xray.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skill_xray = ["rules/*.yml", "schemas/*.json", "schemas/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Real bugs and import hygiene, not style churn. %-formatting is a deliberate
# stdlib idiom in this codebase and is not flagged.
select = ["E", "F", "I", "B"]
