[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-xray"
version = "0.1.0"
description = "Static security scanner for AI skill packages."
readme = "README.md"
# 3.12 floor: the NTFS junction-escape guard needs os.path.isjunction (3.12+).
requires-python = ">=3.12"
# Stdlib only for now. Content parsing, added later, will need PyYAML.
dependencies = []

[project.scripts]
skill-xray = "skill_xray.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Real bugs and import hygiene, not style churn. %-formatting is a deliberate
# stdlib idiom in this codebase and is not flagged.
select = ["E", "F", "I", "B"]
